[workspace]
resolver = "3"
members = [
    "crates/multires",
    "crates/msg_amrex",
    "crates/msg_tools",
    "crates/msg_vti",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8.2"
glam = "0.33"
memchr = "2"
memmap2 = "0.9"
meshopt = "0.6"
rayon = "1.10"
rkyv = { version = "0.8", features = [
    "bytecheck",
    "pointer_width_64",
    "std",
    "little_endian",
    "alloc",
] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

